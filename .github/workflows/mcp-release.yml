name: MCP – Create Release

on:
  push:
    tags:
      - "helius-mcp@*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./helius-mcp

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          # Nothing here pushes with git: the changelog is committed through the
          # GitHub API below, with GH_TOKEN.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          # This job holds a write token, so it never restores a cache that
          # another workflow could have written.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate changelog
        run: pnpm changelog

      - name: Open changelog PR
        working-directory: .
        # Commit via the GitHub Contents API (not `git commit`/`git push`) so the
        # bot commit is automatically signed/verified by GitHub. A git-CLI commit
        # from github-actions[bot] is unsigned and fails verify-signed-commits.yml.
        run: |
          set -euo pipefail
          BRANCH="chore/mcp-changelog-$TAG"

          if git diff --quiet -- helius-mcp/CHANGELOG.md; then
            echo "No changelog changes, skipping PR"
            exit 0
          fi

          # Create (or reset) the branch at the current main HEAD.
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          gh api --method POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$MAIN_SHA" \
            || gh api --method PATCH "repos/$REPO/git/refs/heads/$BRANCH" \
                 -f sha="$MAIN_SHA" -F force=true

          # SHA of the file on the branch (required to update an existing file).
          FILE_SHA=$(gh api "repos/$REPO/contents/helius-mcp/CHANGELOG.md?ref=$BRANCH" --jq '.sha')

          # Commit the regenerated changelog via the API -> verified bot commit.
          gh api --method PUT "repos/$REPO/contents/helius-mcp/CHANGELOG.md" \
            -f message="chore: update CHANGELOG.md for $TAG" \
            -f branch="$BRANCH" \
            -f sha="$FILE_SHA" \
            -f content="$(base64 -w0 helius-mcp/CHANGELOG.md)"

          gh pr create \
            --title "chore: update CHANGELOG.md for $TAG" \
            --body "Automated changelog update for release $TAG. Merge before publishing the draft release to trigger npm publish." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

      - name: Extract release notes
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # Headings are `## [helius-mcp@X.Y.Z](compare-url) - date`, so match
          # the full tag. The tag is passed as data (-v) and matched literally,
          # never spliced into the awk program.
          awk -v heading="## [${TAG}]" 'index($0, heading) == 1 {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > /tmp/release-notes.md
          # Fall back to a placeholder if the section wasn't found
          if [ ! -s /tmp/release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/$REPO/blob/main/helius-mcp/CHANGELOG.md) for details." > /tmp/release-notes.md
          fi

      - name: Create draft GitHub Release
        working-directory: .
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
