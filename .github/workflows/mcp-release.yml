name: MCP – Create Release

on:
  push:
    tags:
      - "helius-mcp@*"

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./helius-mcp

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('helius-mcp/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --prefer-offline

      - name: Generate changelog
        run: pnpm changelog

      - name: Open changelog PR
        working-directory: .
        # Commit via the GitHub Contents API (not `git commit`/`git push`) so the
        # bot commit is automatically signed/verified by GitHub. A git-CLI commit
        # from github-actions[bot] is unsigned and fails verify-signed-commits.yml.
        run: |
          set -euo pipefail
          BRANCH="chore/mcp-changelog-${{ github.ref_name }}"
          REPO="${{ github.repository }}"

          if git diff --quiet -- helius-mcp/CHANGELOG.md; then
            echo "No changelog changes, skipping PR"
            exit 0
          fi

          # Create (or reset) the branch at the current main HEAD.
          MAIN_SHA=$(gh api "repos/$REPO/git/ref/heads/main" --jq '.object.sha')
          gh api --method POST "repos/$REPO/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$MAIN_SHA" \
            || gh api --method PATCH "repos/$REPO/git/refs/heads/$BRANCH" \
                 -f sha="$MAIN_SHA" -F force=true

          # SHA of the file on the branch (required to update an existing file).
          FILE_SHA=$(gh api "repos/$REPO/contents/helius-mcp/CHANGELOG.md?ref=$BRANCH" --jq '.sha')

          # Commit the regenerated changelog via the API -> verified bot commit.
          gh api --method PUT "repos/$REPO/contents/helius-mcp/CHANGELOG.md" \
            -f message="chore: update CHANGELOG.md for ${{ github.ref_name }}" \
            -f branch="$BRANCH" \
            -f sha="$FILE_SHA" \
            -f content="$(base64 -w0 helius-mcp/CHANGELOG.md)"

          gh pr create \
            --title "chore: update CHANGELOG.md for ${{ github.ref_name }}" \
            --body "Automated changelog update for release ${{ github.ref_name }}. Merge before publishing the draft release to trigger npm publish." \
            --base main \
            --head "$BRANCH"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#helius-mcp@}"
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > /tmp/release-notes.md
          # Fall back to a placeholder if the section wasn't found
          if [ ! -s /tmp/release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/helius-mcp/CHANGELOG.md) for details." > /tmp/release-notes.md
          fi

      - name: Create draft GitHub Release
        working-directory: .
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            --draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
