name: Sync Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-compiler-output:
    name: Verify compiled skill outputs are in sync
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run compiler in check mode
        run: npx tsx scripts/compile-skills.ts --check
