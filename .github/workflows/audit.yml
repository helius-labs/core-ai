name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Audit ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [helius-mcp, helius-cli]
    defaults:
      run:
        working-directory: ./${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: pnpm install --frozen-lockfile

      # Fail on HIGH/critical advisories in shipped (production) dependencies.
      # Dev-only advisories are surfaced by Dependabot but do not block CI.
      # Non-blocking on PRs (a transitive advisory shouldn't block unrelated,
      # e.g. docs-only, changes); blocking on the weekly cron + manual runs so
      # newly-disclosed advisories still surface as a failure.
      - run: pnpm audit --prod --audit-level high
        continue-on-error: ${{ github.event_name == 'pull_request' }}
