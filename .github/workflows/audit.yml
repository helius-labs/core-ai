name: Security Audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  audit:
    name: Audit ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [helius-mcp, helius-cli]
    defaults:
      run:
        working-directory: ./${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: pnpm install --frozen-lockfile

      # Fail on HIGH/critical advisories in shipped (production) dependencies.
      # Dev-only advisories are surfaced by Dependabot but do not block CI.
      - run: pnpm audit --prod --audit-level high
