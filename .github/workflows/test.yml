name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [helius-mcp, helius-cli]
    defaults:
      run:
        working-directory: ./${{ matrix.package }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ${{ matrix.package }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Explicit build so a typecheck/build break fails CI even when a
      # package's `test` script does not build (e.g. helius-cli runs vitest only).
      - run: pnpm build

      - run: pnpm test
