version: 2
updates:
  - package-ecosystem: npm
    directory: /helius-mcp
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked version has time to be caught. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      mcp-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /helius-cli
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked version has time to be caught. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      cli-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release, so a compromised or
    # yanked version has time to be caught. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
