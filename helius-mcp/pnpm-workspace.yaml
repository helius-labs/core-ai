packages: []

# Dependency overrides, duplicated from the "pnpm.overrides" field in
# package.json on purpose. pnpm 9 (CI) reads them only from package.json.
# pnpm 12 (what Dependabot runs) reads them only from this file, and without
# it drops them from the lockfile, which breaks CI's frozen install.
# Keep both lists identical: scripts/check-pnpm-overrides.ts enforces it.
overrides:
  'ws@>=8.0.0 <8.21.0': '^8.21.0'
  'hono@<4.12.25': '^4.12.26'
  '@hono/node-server@<1.19.10': '^1.19.10'
  'path-to-regexp@>=8.0.0 <8.4.0': '^8.4.0'
  'fast-uri@<3.1.5': '^3.1.5'
